[hooks]
battery_low_percent_threshold = 15
battery_under_threshold = "notify-send \"Battery\" \"Battery Threshold Low\" \"Battery is low, please plug in charger\""
bluetooth_disabled = "notify-send \"Bluetooth\" \"Disabled\""
bluetooth_enabled = "notify-send \"Bluetooth\" \"Enabled\""
wifi_disabled = "notify-send \"Wi-Fi\" \"Disabled\""
wifi_enabled = "notify-send \"Wi-Fi\" \"Enabled\""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 610

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600

[keybinds]
cancel = [ "Escape" ]
validate = [ "Return" ]

[location]
address = "Ho Chi Minh City, Vietnam"
sunrise = "07:00"
sunset = "18:00"

[lockscreen_widgets]
