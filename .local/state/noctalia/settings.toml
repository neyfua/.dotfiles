[bar]
order = [ "main" ]

    [bar.main]
    capsule = true
    capsule_groups = [ "SysMon", "Utilities" ]
    capsule_opacity = 0.0
    capsule_padding = 4.0
    center = [ "workspaces", "media" ]
    end = [ "tray", "Screen_Recorder", "network", "volume", "battery", "notifications" ]
    margin_edge = 0
    margin_ends = 0
    padding = 6
    position = "right"
    radius = 0
    start = [ "control-center", "clock", "cpu", "temp", "GPU_Temp", "ram", "Disk" ]
    thickness = 44

[control_center]
compact = false

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "weather"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "caffeine"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 3.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[nightlight]
enabled = true

[noctalia_state]
setup_wizard_completed = true

[notification]
background_opacity = 0.93000000715255737
layer = "overlay"

[osd]
position = "bottom_center"

[shell]
avatar_path = "/home/neyfua/.face"
clipboard_auto_paste = "off"
clipboard_image_action_command = "waytator"
date_format = "%A, %B %d %Y"
font_family = "Inter"
password_style = "random"
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = true
time_format = "{:%-I:%M %p}"

    [shell.animation]
    speed = 1.25

    [shell.mpris]
    blacklist = [ "firefox", "Tor Browser" ]

    [shell.panel]
    attach_clipboard = true
    attach_launcher = true

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "logout"
    enabled = true

    [[shell.session.actions]]
    action = "command"
    command = "systemctl suspend"
    enabled = true
    glyph = "suspend"
    label = "Suspend"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true

    [[shell.session.actions]]
    action = "shutdown"
    destructive = true
    enabled = true

[theme]
builtin = "Rosé Pine"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/neyfua/Pictures/Wallpapers"
edge_smoothness = 0.5
transition = [ "disc" ]
transition_duration = 2000

    [wallpaper.default]
    path = "/home/neyfua/Pictures/Wallpapers/earrings.jpg"

    [wallpaper.last]
    path = "/home/neyfua/Pictures/Wallpapers/earrings.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/neyfua/Pictures/Wallpapers/earrings.jpg"

[weather]
auto_locate = true

[widget.Disk]
capsule_group = "SysMon"
show_label = false
stat = "disk_pct"
type = "sysmon"

[widget.GPU_Temp]
capsule_group = "SysMon"
show_label = false
stat = "gpu_temp"
type = "sysmon"

[widget.Screen_Recorder]
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.battery]
capsule_group = "Utilities"
warning_threshold = 10

[widget.clock]
color = "primary"
format = "{:%-I:%M %p}"
vertical_format = "{:%I\\n%M\\n%p}"

[widget.control-center]
custom_image = "/usr/share/pixmaps/distribution-logos/square-hicolor.svg"

[widget.cpu]
capsule_group = "SysMon"
show_label = false

[widget.media]
art_size = 22.0
title_scroll = "on_hover"

[widget.network]
capsule_group = "Utilities"
show_label = false

[widget.ram]
capsule_group = "SysMon"
show_label = false

[widget.temp]
capsule_group = "SysMon"
show_label = false

[widget.tray]
drawer = true
pinned = [ "Fcitx" ]

[widget.volume]
capsule_group = "Utilities"
show_label = false

[widget.workspaces]
display = "none"