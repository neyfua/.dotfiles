config_version = 2

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.87999998033046722
    capsule = true
    capsule_opacity = 0.0
    capsule_padding = 5.0
    center = []
    end = [ "tray", "privacy", "network", "todo", "battery", "weather", "notifications", "clock" ]
