[backdrop]
enabled = true

[bar.default]
capsule = true
capsule_opacity = 0.0
capsule_padding = 4.0
center = [ "control-center", "launcher", "taskbar" ]
end = [ "tray", "screen_recorder", "group:g2", "group:g1" ]
margin_edge = 0
margin_ends = 0
padding = 10
position = "bottom"
radius = 0
start = [ "bongocat", "workspaces", "weather" ]
thickness = 40

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "notifications" ]
    opacity = 0.0
    padding = 4.0

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "volume", "battery" ]
    opacity = 0.0
    padding = 4.0

[control_center]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "screen_recorder"

[desktop_widgets]
enabled = false

[hooks]
battery_low_percent_threshold = 15
battery_under_threshold = "notify-send \"Battery\" \"Battery Threshold Low\" \"Battery is low, please plug in charger\""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 610

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600

[keybinds]
cancel = [ "Escape" ]
validate = [ "Return" ]

[nightlight]
enabled = true
start_time = "18:00"
stop_time = "07:00"
use_weather_location = false

[notification]
layer = "overlay"
scale = 0.90000000596046448

[osd]
keyboard_layout = false
position = "bottom_center"
scale = 0.90000000596046448

[shell]
avatar_path = "/home/neyfua/Pictures/Saved/7fcbe541f805008092e6e431a3dd0f5e.jpg"
clipboard_auto_paste = "off"
clipboard_image_action_command = "waytator"
date_format = "%A, %B %d %Y"
font_family = "Cantarell"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true
time_format = "{:%-I:%M %p}"

    [shell.animation]
    speed = 1.25

    [shell.mpris]
    blacklist = [ "firefox", "Tor Browser" ]

    [shell.panel]
    borders = false
    clipboard_placement = "floating"
    control_center_placement = "floating"
    launcher_categories = false
    launcher_placement = "floating"
    session_placement = "floating"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    enabled = false
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Rosé Pine"

[wallpaper]
directory = "/home/neyfua/Pictures/Wallpapers"
edge_smoothness = 0.59999998658895493
transition = [ "disc" ]

    [wallpaper.default]
    path = "/home/neyfua/Pictures/Wallpapers/flower7.png"

    [wallpaper.last]
    path = "/home/neyfua/Pictures/Wallpapers/flower7.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/neyfua/Pictures/Wallpapers/flower7.png"

    [[wallpaper.favorite]]
    builtin_palette = "Rosé Pine"
    palette_source = "builtin"
    path = "/home/neyfua/Pictures/Wallpapers/umbrella.png"
    theme_mode = "dark"

[weather]
address = "Ho Chi Minh City, Vietnam"

[widget.battery]
display_mode = "graphic"

[widget.bongocat]
audio_spectrum = true
hot_reload = true
scale = 1.05
script = "scripts/bongocat.lua"
tappy_mode = true
type = "scripted"

[widget.clock]
color = "primary"
font_weight = 700
format = "{:%-I:%M %p\\n%m/%d/%Y}"
scale = 1.25

[widget.control-center]
custom_image = "/usr/share/pixmaps/distribution-logos/square-hicolor.svg"

[widget.network]
show_label = false

[widget.screen_recorder]
hot_reload = true
restore_portal = true
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.taskbar]
scale = 1.1500000000000001

[widget.tray]
drawer = true
drawer_columns = 5
pinned = [ "Fcitx" ]

[widget.volume]
scroll_step = 2
show_label = false

[widget.workspaces]
empty_color = "outline"
font_weight = 700
hide_when_empty = true
minimal = true
occupied_color = "outline"
scale = 1.1000000000000001