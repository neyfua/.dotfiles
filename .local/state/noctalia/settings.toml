widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    cx = 108.0
    cy = 100.5
    output = "eDP-1"
    rotation = 0.0
    scale = 1.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background_opacity = 0.91000000000000003
        color = "primary"
        color2 = "error"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    cx = 108.0
    cy = 236.5
    output = "eDP-1"
    rotation = 0.0
    scale = 1.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background_opacity = 0.91000000000000003
        color2 = "tertiary"
        stat = "ram_pct"
        stat2 = "swap_pct"

[dock]
active_scale = 0.90000000000000002
enabled = true
icon_size = 40
inactive_opacity = 0.94999999999999996
inactive_scale = 0.80000000000000004
item_spacing = 0
launcher_icon = "brand-finder"
launcher_position = "start"
margin_edge = 0
padding = 0
pinned = [
    "foot",
    "zen",
    "vesktop",
    "spotify",
    "steam",
    "zalo",
    "sober",
    "tor-browser",
    "files",
    "antigravity",
    "rider",
    "cursor",
    "obsidian",
    "onlyoffice",
    "podman-desktop",
    "rustdesk",
    "winboat",
    "virt-manager"
]
radius = 14
show_dots = true
