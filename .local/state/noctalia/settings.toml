[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.90000000000000002
    capsule = true
    capsule_opacity = 0.0
    capsule_padding = 3.0
    center = []
    end = [ "tray", "battery", "screen_recorder", "weather", "notifications", "clock" ]
    margin_edge = 0
    margin_ends = 0
    padding = 8
    radius = 0
    scale = 1.1000000000000001
    start = [ "control-center", "Finder", "File", "Edit", "View", "Window", "Help" ]
    thickness = 28

[battery]
warning_threshold = 15

[control_center]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
