set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*:Tc"
set -sg terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%d'
set -as terminal-overrides ',*:Setulc=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%dm'
set -g allow-passthrough on
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g allow-rename on
set -s escape-time 0
set -g mouse on
set-option -g set-clipboard on

#=============#
#   Plugins   #
#=============#
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'

#==========#
#   Misc   #
#==========#
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'foot*:extkeys'
set -as terminal-features 'xterm*:extkeys'

set -g repeat-time 1000
set -g detach-on-destroy off
# close numeric gaps when a session is killed (0,3,4 -> 0,1,2)
set-hook -g session-closed "run-shell 'sh ~/.config/tmux/session.sh renumber'"
set -g history-limit 100000
set -g status-position bottom
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
set -g @vim_navigator_prefix_mapping_clear_screen ""

#============#
#   Keymap   #
#============#
# Change prefix key
set-window-option -g mode-keys vi
set -g prefix C-Space
bind C-Space send-prefix
unbind C-b
unbind -T copy-mode-vi g
unbind -T copy-mode-vi G

# Kill all sessions
bind \\ confirm-before -p "Kill all sessions? (y/n)" kill-server

# Session/window chooser sorted by name
bind s choose-tree -Zs -O name
bind w choose-tree -Zw -O name

# Kill current workspace (all panes in window)
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind S-x confirm-before -p "kill-window #W? (y/n)" kill-window

# Copy mode
bind Up copy-mode
bind Left copy-mode
bind Right copy-mode
bind Down copy-mode

# Scroll navigation (matches foot terminal)
# In normal mode: enters copy-mode and scrolls (passes through when inside vim/fullscreen apps via alternate_on)
bind -n M-Up if-shell -F '#{alternate_on}' 'send-keys C-Up' 'copy-mode ; send-keys -X scroll-up'
bind -n M-Down if-shell -F '#{alternate_on}' 'send-keys C-Down' 'if-shell -F "#{pane_in_mode}" "send-keys -X scroll-down"'
bind -n S-Up if-shell -F '#{alternate_on}' 'send-keys S-Up' 'copy-mode ; send-keys -X page-up'
bind -n S-Down if-shell -F '#{alternate_on}' 'send-keys S-Down' 'if-shell -F "#{pane_in_mode}" "send-keys -X page-down"'

# In copy mode:
bind -T copy-mode-vi C-Up send-keys -X scroll-up
bind -T copy-mode-vi C-Down send-keys -X scroll-down
# Unbind keybindings
unbind &
unbind [
unbind -n C-Space
unbind -n C-S-p
# Preserve Ctrl+Shift+P; tmux mode 1 otherwise collapses it to Ctrl+P.
bind -n C-S-P send-keys -H 1b 5b 38 30 3b 36 75
# Paste from system clipboard in SSH sessions, pass Ctrl+v through everywhere else (Claude image paste, Neovim, Fish)
bind -n C-v if-shell -F '#{m/r:^(ssh|mosh.*|autossh)$,#{pane_current_command}}' \
  'run-shell "wl-paste -n 2>/dev/null | tmux load-buffer - ; tmux paste-buffer -p"' \
  'send-keys C-v'
# Move next/previous window
# bind -n M-Right next-window
# bind -n M-Left previous-window
# Create new session at current+1, shifting higher numbered sessions up
bind n run-shell "sh ~/.config/tmux/session.sh insert '#{session_id}'"
# Renaming keeps the "<n> ~ " prefix so the session never changes position
# shortcut: new name is shell-quoted, a name containing ' breaks it; upgrade to a prompt popup if that matters
bind r command-prompt -I "#{s/^[0-9]+ ~ //:session_name}" "run-shell \"sh ~/.config/tmux/session.sh rename '#{session_id}' '%%'\""
bind \$ command-prompt -I "#{s/^[0-9]+ ~ //:session_name}" "run-shell \"sh ~/.config/tmux/session.sh rename '#{session_id}' '%%'\""
bind , command-prompt -I "#W" "rename-window -- '%%' ; if-shell -F '#{==:#{window_name},}' 'set-option -w automatic-rename on'"
bind -T copy-mode-vi S-Right send-keys -X next-word
bind -T copy-mode-vi S-Left send-keys -X previous-word
bind -T copy-mode-vi S-Up send-keys -X page-up
bind -T copy-mode-vi S-Down send-keys -X page-down
bind -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Jump to top/home
bind -T copy-mode-vi C-S-Up send-keys -X history-top
# Jump to bottom/end
bind -T copy-mode-vi C-S-Down send-keys -X history-bottom

# Source file
bind o source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Navigators
set -g @vim_navigator_mapping_left "M-Left"
set -g @vim_navigator_mapping_right "M-Right"
set -g @vim_navigator_mapping_up "M-Up"
set -g @vim_navigator_mapping_down "M-Down"
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

# Move (swap) pane with Alt+Shift+arrows
bind -n M-S-Left if-shell -F '#{>:#{window_panes},1}' 'swap-pane -s "{left-of}"'
bind -n M-S-Right if-shell -F '#{>:#{window_panes},1}' 'swap-pane -s "{right-of}"'
bind -n M-S-Up if-shell -F '#{>:#{window_panes},1}' 'swap-pane -s "{up-of}"'
bind -n M-S-Down if-shell -F '#{>:#{window_panes},1}' 'swap-pane -s "{down-of}"'

# Move (swap) window with Ctrl+Alt+arrows
bind -n C-M-Left swap-window -d -t -1
bind -n C-M-Right swap-window -d -t +1

#================#
#   Appearance   #
#================#
set -g @rose_pine_host 'off' # Enables hostname in the status bar
set -g @rose_pine_hostname_short 'off' # Makes the hostname shorter by using tmux's '#h' format
set -g @rose_pine_date_time '' # It accepts the date UNIX command format (man date for info)
set -g @rose_pine_user 'off' # Turn on the username component in the statusbar
set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar

set -g @rose_pine_bar_bg_disable 'off' # Disables background color, for transparent terminal emulators
# If @rose_pine_bar_bg_disable is set to 'on', uses the provided value to set the background color
# It can be any of the on tmux (named colors, 256-color set, `default` or hex colors)
# See more on http://man.openbsd.org/OpenBSD-current/man1/tmux.1#STYLES
set -g @rose_pine_bar_bg_disabled_color_option 'default'

# Some of these are mutually exclusive, recommended to test which one you like
set -g @rose_pine_only_windows 'on' # Leaves only the window module, for max focus and space
set -g @rose_pine_window_status_separator "  " # Changes the default icon that appears between window names
set -g @rose_pine_disable_active_window_menu 'on' # Disables the menu that shows the active window on the left
set -g @rose_pine_default_window_behavior 'on' # Forces tmux default window list behaviour

set -g @rose_pine_show_current_program 'on' # Forces tmux to show the current running program as window name
set -g @rose_pine_show_pane_directory 'on' # Forces tmux to show the current directory as window name
# Previously set -g @rose_pine_window_tabs_enabled

# Example values for these can be:
set -g @rose_pine_left_separator ' > ' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator ' < ' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator '  ' # Default is two-space-padded, but can be set to anything
set -g @rose_pine_window_separator ' - ' # Replaces the default `:` between the window number and name

# These are not padded
set -g @rose_pine_session_icon '' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '󰃰' # Changes the default icon to the right of the date module

# Very beta and specific opt-in settings, tested on v3.4, look at issue #10
set -g @rose_pine_prioritize_windows 'on' # Disables the right side functionality in a certain window count / terminal width
set -g @rose_pine_width_to_hide '80' # Specify a terminal width to toggle off most of the right side functionality
set -g @rose_pine_window_count '5' # Specify a number of windows, if there are more than the number, do the same as width_to_hide

run '~/.tmux/plugins/tpm/tpm'

# Pin Rose Pine line colors after the plugin so they always win
set -g pane-border-style "fg=#403d52"        # overlay
set -g pane-active-border-style "fg=#c4a7e7" # iris
set -g pane-border-indicators colour
set -g popup-style "fg=#908caa,bg=#191724"
set -g popup-border-style "fg=#403d52"
set -g mode-style "fg=#c4a7e7,bg=#403d52"
set -g menu-style "fg=#e0def4,bg=#191724"
set -g menu-selected-style "fg=#ebbcba,bg=#403d52"
set -g menu-border-style "fg=#403d52,bg=#191724"

# choose-tree (C-Space S) chrome
setw -g tree-mode-border-style "fg=#e0def4,bg=#191724"
set -g message-style "fg=#e0def4,bg=#191724,fill=#191724"
setw -g tree-mode-preview-style "fg=#c4a7e7,bg=#191724"

# Session index before the window list; turns rose while prefix is held
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[fg=#eb6f92],#[fg=#c4a7e7]}#{session_name} #[fg=#6e6a86]|#[default] "

# Rose Pine theme tokens for tmux 3.8+ semantic colors (choose-tree, etc.)
set -s dark-theme-black "#191724"
set -s dark-theme-dark-grey "#26233a"
set -s dark-theme-light-grey "#908caa"
set -s dark-theme-white "#e0def4"
set -s dark-theme-green "#31748f"      # pine (matches + expand)
set -s dark-theme-yellow "#f6c177"     # gold
set -s dark-theme-red "#eb6f92"        # love (matches - collapse)
set -s dark-theme-blue "#9ccfd8"       # foam
set -s dark-theme-magenta "#c4a7e7"    # iris
set -s dark-theme-cyan "#ebbcba"       # rose
