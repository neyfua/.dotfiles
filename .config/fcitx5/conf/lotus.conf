# Mode
Mode="Uinput (Smooth)"
# Input Method
InputMethod=VNI
# Output Charset
OutputCharset=Unicode
# Type w to Produce ư
W2U=Disabled
# Enable Spell Check
SpellCheck=False
# Enable Macro
EnableMacro=False
# Capitalize Macro
CapitalizeMacro=False
# Auto capitalize after sentence-ending punctuation (. ! ? Enter) (experimental)
AutoCapitalizeAfterPunctuation=False
# Double Space to Period (experimental)
DoubleSpaceToPeriod=False
# Auto Restore Invalid Words
AutoNonVnRestore=False
# Use oà, uý (Instead Of òa, úy)
ModernStyle=True
# Allow Type With More Freedom
FreeMarking=True
# Allow dd To Produce đ When Auto Restore Invalid Words Is On
DdFreeStyle=True
# Fix Uinput Mode With Ack
FixUinputWithAck=True
# Use Lotus Status Icons
UseLotusIcons=True
# Enable Custom Dictionary
EnableDictionary=False
# Enable Custom Keymap
EnableCustomKeymap=False
# Show Uinput (Smooth)
ShowModeSmooth=True
# Show Uinput (Slow)
ShowModeUinput=True
# Show Minecraft
ShowModeMinecraft=False
# Show Surrounding Text
ShowModeSurroundingText=False
# Show Preedit
ShowModePreedit=True
# Show Emoji Picker
ShowModeEmoji=False
# Show OFF
ShowModeOff=False
# Show Default Typing
ShowModeDefault=False
# Time Format ($TIME in macro)
TimeFormat=%H:%M
# Date Format ($DATE in macro)
DateFormat=%d/%m/%Y
# Icon Color
IconTheme=Auto

[ModeMenuKey]
0=Alt+asciitilde

