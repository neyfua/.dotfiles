#===============#
#==== Input ====# (https://docs.noctalia.dev/umbriel/input/)
#===============#
[input]
middle_click_paste = false
client_window_drag = false
window_drag_toggle = "none"

[input.keyboard]
# layout = ""           # empty uses the system default
# variant = ""
# options = ""
# model = ""
repeat_rate = 40
repeat_delay = 200
# numlock_toggle = true
# track_layout = "global"
# layout = "us,de"
# options = "grp:alt_shift_toggle"

[input.touchpad]
tap = true
natural_scroll = true
left_handed = false
accel_profile = "flat"
sensitivity = 0.9
scroll_factor = 0.45
disable_while_typing = true
disable_on_external_mouse = true
# click_method = "clickfinger"
# tap_button_map = "left_middle_right"

[input.mouse]
# natural_scroll = false
# left_handed = false
accel_profile = "flat"
sensitivity = 0.1
# scroll_wheel_step = 60
# scroll_button = "MouseBack"
# scroll_button_lock = false

[input.cursor]
theme = "macOS"
size = 28
hardware_cursor = true
follows_focus = false
hide_when_typing = false
hide_timeout_ms = 0

[input.focus]
follows_mouse = false
# follows_mouse_max_scroll = 0.5  # optional, measured in viewport widths

#====================#
#==== Appearance ====# (https://docs.noctalia.dev/umbriel/appearance/)
#====================#
[colors]
background = "#191724"
text_primary = "#e0def4"
text_muted = "#6e6a86"
accent_primary = "#ebbcba"
accent_secondary = "#9ccfd8"
warning = "#f6c177"
error = "#eb6f92"
insert_hint = "#31748f"
backdrop = "#000000FF"
shadow = "#0000007F"

[colors.border]
focused = "#ebbcba"
unfocused = "#191724"
outer = "#191724"

[colors.overview]
background_tint = "#10101430"
workspace_background = "#00000044"
badge = "#ebbcba"

[colors.tab_bar]
background = "#191724"
text = "#e0def4"
active = "#ebbcba"
active_text = "#191724"
active_unfocused = "#191724"
active_unfocused_text = "#e0def4"
urgent = "#eb6f92"
urgent_text = "#191724"

[appearance]
prefer_no_csd = true
border_width = 3
outer_border_width = 0
corner_radius = 12
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.tab_bar]
style = "titles"
position = "top"
height = 24
font = "SF Pro Display 10"
padding = 8
tab_gap = 2
corner_radius = -1
title_format = "{title}"
title_align = "center"
visible = true
hide_when_single = false
max_tabs = 0
overflow = "scroll"

[appearance.blur]
enabled = true
optimized = false
passes = 3                     # 0-8
radius = 3                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 0.9               # 0.0-2.0
contrast = 0.9                 # 0.0-2.0
saturation = 1.1               # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 18                  # 0-200, 0 = hard edge
offset_x = 0                   # -200 to 200
offset_y = 0

#===================#
#==== Animation ====# (https://docs.noctalia.dev/umbriel/animation/)
#===================#
[animation]
enabled = true
duration_ms = 200
curve = "easeout"

[animation.windows_in]
enabled = true
curve = "linear"
style = "slide"
scale = 0.5

[animation.windows_out]
enabled = true
curve = "linear"
style = "slide"
scale = 0.8

[animation.windows_move]
enabled = true
curve = "easeout"

[animation.workspaces]
style = "slide"
enabled = true
curve = "easeout"

[animation.overview]
enabled = true
curve = "easeout"

# [animation.scratchpad]
# enabled = true
# curve = "spring:1,800"
# dim = 0.8
# blur = false
# scale = 0.0
# maximize = false
# fullscreen = false

[animation.border]
enabled = true
curve = "spring:1,900"

[animation.dim_unfocused]
enabled = false
dim = 0.0

[animation.layers]
enabled = false

[animation.windows_drag]
physics = false

#================#
#==== Layout ====# (https://docs.noctalia.dev/umbriel/layout/)
#================#
[layout]
mode = "scrolling"                   # "scrolling", "dwindle", or "master"
gap = 10                             # 0-500
extent_presets = [0.25, 0.5, 0.75, 1.0]
# new_exits_fullscreen = []  # "tiled", "floating", "pinned", "all", or an array such as ["tiled", "floating"]

[layout.struts]
# left = 0
# right = 0
# top = 0
bottom = -6

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "never"

[layout.dwindle]
preserve_split = false
new_toward_cursor = false

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true
new_becomes_master = false

[layout.tabs]
default_display = "normal"
new_tab_position = "end"
wrap_focus = true
scroll_switches_tabs = true
middle_click_closes = false

#====================#
#==== Workspaces ====# (https://docs.noctalia.dev/umbriel/workspaces/)
#====================#
[workspaces]
back_and_forth = false
empty_above = false

#=============================#
#==== Workspaces Overview ====# (https://docs.noctalia.dev/umbriel/workspaces-overview/)
#=============================#
[overview]
zoom = 0.75
# scroll_factor_horizontal = 1.0
# scroll_factor_vertical = 1.0
background_blur = true
workspace_wallpaper = true
shortcuts = false
# shortcut_keys = "1234567890"

#======================#
#==== Window Rules ====# (https://docs.noctalia.dev/umbriel/window-rules/)
#======================#
[[window_rule]]
blur = true
[[window_rule]]
match.is_focused = false
opacity = 0.97
[[window_rule]]
match.is_alone = true
default_maximize = true
border_width = 0
outer_border_width = 0

[[window_rule]]
match.app_id = "code|^.*Zed$|^jetbrains.*$|antigravity|cursor|Chatgpt|^virt-.*$|steam|Upload Labs|^.*Sober$|^.*robloxstudio$|^.*PolyMC$|CurseForge|^.*PrismLauncher$|^.*Minecraft.*$"
default_workspace = 1
default_focused = true

[[window_rule]]
match.app_id = "firefox|floorp|^.*zen$|Tor Browser|^.*torbrowser-launcher$"
default_workspace	= 2
default_focused = true

[[window_rule]]
match.app_id = "discord|equibop|vesktop|^.*Cressida$|^.*telegram.*$|^.*fluxer.*$|zalo|Zalo|me.proton.Mail"
default_workspace = 3
default_focused = true

[[window_rule]]
match.app_id = "spotify|Spotify"
default_workspace = 4
default_focused = true

[[window_rule]]
match.app_id = "winboat|blender|zoom"
default_workspace = 5
[[window_rule]]
match.title = "^OBS.*$"
default_workspace = 5

# default_maximize = true
[[window_rule]]
match.app_id = "code|^.*Zed$|^jetbrains.*$|antigravity|cursor|^.*robloxstudio$|Chatgpt|^virt-.*$|firefox|floorp|Tor Browser|^.*torbrowser-launcher$|^.*zen$|discord|equibop|vesktop|^.*Cressida$|^.*telegram.*$|^.*fluxer.*$|zalo|Zalo|^.*telegram.*$|spotify|Spotify|ONLYOFFICE|me.proton.Mail"
default_maximize = true
[[window_rule]]
match.title = "^OBS.*$|CurseForge|^.*PrismLauncher$"
default_maximize = true
[[window_rule]]
match.app_id = "steam"
match.title = "Steam"
default_maximize = true
[[window_rule]]
match.app_id = "zoom"
match.title = "^Zoom Workplace.*$"
default_maximize = true

# default_floating = true, default_position
[[window_rule]]
