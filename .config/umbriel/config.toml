[[window_rule]]
match.app_id = "code"
match.title = "^Settings.*$|^Uninstall$"
default_floating = true
default_position = { x = 0, y = 0, anchor = "center" }

# default_floating = false
[[window_rule]]
match.app_id = "winboat"
default_floating = false
[[window_rule]]
match.app_id = "^OBS.*$"
default_floating = false
[[window_rule]]
match.app_id = "virt-manager"
match.title = "Virtual Machine Manager|^.*on QEMU/KVM$"
