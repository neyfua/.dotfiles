# file roller
[[window_rule]]
match.app_id = "^.*FileRoller$"
default_floating = true
default_floating_size_px = { width = 500, height = 700 }

# notification toasts
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# match.content_type = "game"
[[window_rule]]
match.content_type = "game"
match.xdg_tag = "^proton-game$"
default_fullscreen = true
[[window_rule]]
match.content_type = "game"
vrr = "always"
[[window_rule]]
match.app_id = "^steam_app_[0-9]+$"
hdr = "fullscreen"

#=====================#
#==== Layer Rules ====# (https://docs.noctalia.dev/umbriel/layer-rules/)
#=====================#
[[layer_rule]]
match.namespace="^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

