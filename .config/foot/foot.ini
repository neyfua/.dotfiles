[main]
include=~/.config/foot/themes/rose-pine
# term=xterm-256color
term=foot
font=RecMonoSmCasual Nerd Font Propo:size=13.5
pad=17x17 center-when-maximized-and-fullscreen

[security]
osc52=enabled

[bell]
system=no

[scrollback]
lines=50000
indicator-position=none

[url]
launch=xdg-open ${url}

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=Shift+Up
scrollback-up-line=Control+Up
scrollback-down-page=Shift+Down
scrollback-down-line=Control+Down
scrollback-home=Alt+Shift+Up
scrollback-end=Alt+Shift+Down
clipboard-copy=Control+c
clipboard-paste=none
search-start=Alt+Shift+f
spawn-terminal=none
show-urls-launch=Control+q
show-urls-copy=Control+Shift+q
quit=none
unicode-input=none
prompt-prev=none
prompt-prev=none

[search-bindings]
commit=Return
find-next=Down
find-prev=Up

[text-bindings]
\x1b[80;6u=Control+Shift+p
\x1b[78;6u=Control+Shift+n
\x1b[65;6u=Control+Shift+a
\x1b[47;6u=Control+Shift+slash
\x1b[67;6u=Control+Shift+c
\x1b[90;6u=Control+Shift+z

[text-bindings]
\x1b[80;6u=Control+Shift+p
\x1b[78;6u=Control+Shift+n
\x1b[65;6u=Control+Shift+a
\x1b[47;6u=Control+Shift+slash
\x1b[67;6u=Control+Shift+c
\x1b[90;6u=Control+Shift+z
