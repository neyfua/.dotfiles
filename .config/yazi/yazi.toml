[tasks]
image_bound = [65535, 65535]

[mgr]
sort_by = "natural"
sort_sensitive = true
sort_translit = true
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"

[opener]
# edit = [{ run = 'nvim "$@"', block = true, for = "unix" }]
# open = [{ run = 'xdg-open "$@"', desc = "Open" }]
play = [{ run = "mpv %s", orphan = true, for = "unix" }]
edit = [{ run = '$EDITOR %s', block = true, for = "unix" }]
open = [{ run = 'xdg-open %s1', desc = "Open" }]

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*/"
run   = "git"
group = "git"
